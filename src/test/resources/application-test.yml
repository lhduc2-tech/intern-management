spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: test-jwt-secret-key-for-intern-management-32-bytes
    expiration-ms: 86400000

application:
  version: api/v1
  path:
    base:
      private: /private/${application.version}
      public: /public/${application.version}
